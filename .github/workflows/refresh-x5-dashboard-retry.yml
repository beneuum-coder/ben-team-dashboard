name: Refresh X5 dashboard (retry)

# The CRM login page sits behind a Cloudflare bot challenge that is decided per
# source IP, and the CRM read endpoints intermittently time out. The refresh
# workflow therefore fails randomly. A rerun gets a fresh runner with a different
# egress IP, so retrying the whole run a few times converts a flaky pipeline into
# a reliable one. This wrapper owns the schedule; refresh-x5-dashboard.yml keeps
# workflow_dispatch only so the two never fire twice.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the snapshot is still fresh"
        type: boolean
        default: false
  schedule:
    # Every 4 hours at :17 UTC. Shanghai delivery is 00:17 / 04:17 / 08:17 /
    # 12:17 / 16:17 / 20:17, but GitHub dispatches scheduled runs several hours
    # late (measured 3-21h), so the wall-clock times drift.
    - cron: '17 */4 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: x5-dashboard-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Skip when the snapshot is still fresh
        id: guard
        run: |
          # Scheduled runs can be delivered hours late and then queue up behind
          # each other, so "already refreshed today" is too coarse: a 4-hourly
          # cadence needs a freshness check instead.
          MAX_AGE_MIN=210
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force input set; running regardless of snapshot age."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gen=$(grep -o '"generatedAt":"[^"]*"' outputs/lark-dashboard-data.js | head -1 | cut -d'"' -f4)
          gen_epoch=$(date -d "$gen" +%s 2>/dev/null || echo 0)
          now_epoch=$(date -u +%s)
          if [ "$gen_epoch" -gt 0 ]; then
            age_min=$(( (now_epoch - gen_epoch) / 60 ))
          else
            age_min=999999
          fi
          echo "Snapshot: ${gen:-unknown} | age: ${age_min} min | threshold: ${MAX_AGE_MIN} min"
          if [ "$age_min" -lt "$MAX_AGE_MIN" ]; then
            echo "Snapshot is still fresh (${age_min} min old); nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Snapshot is stale (${age_min} min old); refreshing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch refresh and retry transient failures
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            echo "::group::attempt ${attempt}"
            before=$(gh run list --workflow=refresh-x5-dashboard.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            gh workflow run refresh-x5-dashboard.yml --ref main
            run_id=""
            for _ in $(seq 1 30); do
              sleep 6
              run_id=$(gh run list --workflow=refresh-x5-dashboard.yml --limit 10 --json databaseId \
                --jq "[.[] | select(.databaseId > $before)] | .[0].databaseId // empty" || true)
              [ -n "$run_id" ] && break
            done
            if [ -z "$run_id" ]; then
              echo "attempt ${attempt}: dispatched run never appeared; retrying"
              echo "::endgroup::"
              continue
            fi
            gh run watch "$run_id" --exit-status --interval 20 || true
            conclusion=$(gh run view "$run_id" --json conclusion --jq '.conclusion')
            echo "attempt ${attempt}: run ${run_id} -> ${conclusion}"
            echo "::endgroup::"
            if [ "$conclusion" = "success" ]; then
              echo "Dashboard refreshed on attempt ${attempt}."
              exit 0
            fi
            case "$conclusion" in
              cancelled|skipped)
                echo "::error::run ${run_id} ended as ${conclusion}; not retrying"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::refresh failed on all 5 attempts; CRM or Cloudflare may be blocking every runner"
          exit 1
