name: Calibrate X5 dashboard history

on:
  workflow_dispatch:
  schedule:
    # 23:17 Asia/Shanghai (15:17 UTC): complete current-month history calibration.
    - cron: '17 15 * * *'

permissions:
  contents: write

concurrency:
  group: x5-dashboard-write
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: pip install requests pyotp
      - name: Recalibrate verified X5 MTD Gross history to Lark
        env:
          CRM_USER: ${{ secrets.CRM_USER }}
          CRM_PASS: ${{ secrets.CRM_PASS }}
          CRM_TOTP: ${{ secrets.CRM_TOTP }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_TOKEN: ${{ secrets.LARK_APP_TOKEN }}
        run: python scripts/sync_x5_daily_gross.py --mode full --apply --dashboard-export "$RUNNER_TEMP/x5-dashboard-export.json"
      - name: Export all Dashboard Lark data
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_TOKEN: ${{ secrets.LARK_APP_TOKEN }}
        run: python scripts/export_dashboard_lark_data.py --x5-export "$RUNNER_TEMP/x5-dashboard-export.json" --output "$RUNNER_TEMP/dashboard-lark-export.json"
      - name: Publish the complete verified Dashboard snapshot
        run: python scripts/publish_x5_dashboard_data.py --export "$RUNNER_TEMP/x5-dashboard-export.json" --dashboard-export "$RUNNER_TEMP/dashboard-lark-export.json"
      - name: Commit calibrated dashboard data
        run: |
          if git diff --quiet -- outputs/lark-dashboard-data.js outputs/团队扩编与筛选体系框架-可视化编辑版.html; then
            echo "No dashboard data change to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/lark-dashboard-data.js outputs/团队扩编与筛选体系框架-可视化编辑版.html
          git commit -m "Calibrate X5 dashboard snapshot"
          git push origin HEAD:main
