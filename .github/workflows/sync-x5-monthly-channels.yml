name: Sync X5 monthly channel data

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write verified current-month channel rows to Lark
        required: true
        default: false
        type: boolean
  schedule:
    # 13:20 Asia/Shanghai. Keep the channel table current once per day.
    - cron: '20 5 * * *'

permissions:
  contents: write

concurrency:
  group: x5-monthly-channel-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: pip install requests pyotp
      - name: Preview current-month X5 channel data
        env:
          CRM_USER: ${{ secrets.CRM_USER }}
          CRM_PASS: ${{ secrets.CRM_PASS }}
          CRM_TOTP: ${{ secrets.CRM_TOTP }}
          CX_USER: ${{ secrets.CX_USER }}
          CX_PASS: ${{ secrets.CX_PASS }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_TOKEN: ${{ secrets.LARK_APP_TOKEN }}
        run: |
          set -o pipefail
          run_sync() {
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" != "true" ]; then
              python scripts/sync_x5_channel_monthly.py | tee "$RUNNER_TEMP/x5-channel-preview.json"
            else
              python scripts/sync_x5_channel_monthly.py --apply | tee "$RUNNER_TEMP/x5-channel-apply.json"
            fi
          }
          for attempt in 1 2 3; do
            if run_sync; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "X5 channel source attempt $attempt failed; retrying in 30 seconds."
              sleep 30
            fi
          done
          exit 1
      - name: Refresh published dashboard snapshot
        if: github.event_name != 'workflow_dispatch' || inputs.apply == true
        env:
          CRM_USER: ${{ secrets.CRM_USER }}
          CRM_PASS: ${{ secrets.CRM_PASS }}
          CRM_TOTP: ${{ secrets.CRM_TOTP }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_TOKEN: ${{ secrets.LARK_APP_TOKEN }}
        run: |
          python scripts/sync_x5_daily_gross.py --mode current --apply --dashboard-export "$RUNNER_TEMP/x5-dashboard-export.json"
          python scripts/export_dashboard_lark_data.py --x5-export "$RUNNER_TEMP/x5-dashboard-export.json" --output "$RUNNER_TEMP/dashboard-lark-export.json"
          python scripts/publish_x5_dashboard_data.py --export "$RUNNER_TEMP/x5-dashboard-export.json" --dashboard-export "$RUNNER_TEMP/dashboard-lark-export.json"
      - name: Commit refreshed dashboard data
        if: github.event_name != 'workflow_dispatch' || inputs.apply == true
        run: |
          if git diff --quiet -- outputs/lark-dashboard-data.js outputs/团队扩编与筛选体系框架-可视化编辑版.html; then
            echo "No dashboard data change to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/lark-dashboard-data.js outputs/团队扩编与筛选体系框架-可视化编辑版.html
          git commit -m "Refresh X5 dashboard snapshot"
          git push origin HEAD:main
